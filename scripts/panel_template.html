<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
<div id="top-shell" class="top-shell">
  <div class="top-bar">
    <div class="brand-cluster" id="brand-cluster" role="button" tabindex="0">
      <span class="brand-mark"><span class="brand-square"></span> TAGIR</span>
      <span class="brand-subtitle">Личная рабочая панель</span>
    </div>
    <div class="top-controls">
      <div class="global-search-wrap">
        <input id="global-search" class="global-search-input" type="search" placeholder="Поиск по панели…">
        <div id="search-dropdown" class="global-search-dropdown" hidden></div>
      </div>
      <button id="btn-export" class="btn btn-sm" type="button">↓ Экспорт</button>
      <button id="btn-import" class="btn btn-sm" type="button">↑ Импорт</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <span class="storage-pill"><span class="storage-dot"></span><span id="storage-state">локальный браузер</span></span>
    </div>
  </div>
  <nav class="nav-strip" id="nav-strip" aria-label="Основная навигация"></nav>
</div>
<main class="workspace" id="workspace"><!--VIEWS--></main>
<footer class="panel-footer">
  <span>Личная рабочая панель TAGIR · v1.0</span>
  <span>Данные в браузере (localStorage) + panel-seed.json</span>
</footer>
<div id="modal-backdrop" class="modal-backdrop" hidden></div>
<div id="save-toast" class="save-toast" hidden>

</div>
